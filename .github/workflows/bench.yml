name: bench
on: [push, workflow_dispatch]
jobs:
  bench:
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: brew install xcodegen && xcodegen generate
      - name: Run scroll bench on iPhone 16 Pro simulator
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; c=[x for k,v in d.items() if 'iOS' in k for x in v if x['name']=='iPhone 16 Pro']; print(c[-1]['udid'])")
          echo "Simulator $UDID"
          xcodebuild test -project GridLab.xcodeproj -scheme GridLab -destination "id=$UDID" CODE_SIGNING_ALLOWED=NO 2>&1 | tee test.log | grep -E "BENCH|error:|Test Case|\*\* " || true
          grep -q "TEST SUCCEEDED\|Executed" test.log
      - name: Results
        if: always()
        run: grep "BENCH" test.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-log
          path: test.log
